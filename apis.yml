name: Dealer.com
kind: company
description: >-
  Dealer.com, a Cox Automotive brand, builds automotive dealership websites, digital
  advertising, and digital marketing technology used by thousands of franchise and
  independent dealers across North America. It publishes two distinct developer surfaces.
  The Dealer Developer Portal at developer.inv.dealer.com documents a read-only REST family
  — Accounts, Incentives and Inventory (Vehicle, Equipment, Price) — authenticated with a
  single self-registered API key, with published quotas of 2 calls/second and 5,000
  calls/day, offset pagination, sparse fieldsets via a repeatable select parameter, and
  HAL-style hypermedia links. The Website Integration API, documented in public git at
  github.com/DealerDotCom, is a browser-side JavaScript API that lets Integrated Partner
  Program partners subscribe to page and vehicle events and insert markup, CTAs and gallery
  content into named locations on dealer sites, with content-delivery authentication built
  on signed JWTs validated against a live JWK Set. Platform-level lead, deal and
  digital-retail data flows separately through the OAuth-gated Cox Automotive Integration
  Platform at developer.coxautoinc.com. Both Dealer.com surfaces are documented in public;
  the credentials, not the contracts, are what is gated. The published REST surface is
  decaying, though — the documented base host api.dealer.com no longer resolves, and the
  five Swagger documents the portal's own API Explorer loads have contained an AWS API
  Gateway error string since February 2020.
