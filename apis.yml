    description: >-
      Lead generation and management capability - pre-qualification, messaging,
      and customer-engagement tools that capture website leads and route them into
      dealer CRM and Cox Automotive systems (Dealertrack, VinSolutions). The Cox
      Automotive Integration Platform documents Lead Management operations to view,
      create, and update leads, including trade-ins and vehicles of interest, but
      behind OAuth and an approved partner agreement. Endpoints modeled, not an
      open public surface.
