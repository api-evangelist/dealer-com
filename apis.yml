  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.dealer.com/company-news/data-integration-unlocks-website-personalization-press-release/
  endpointsModeled: true
  properties:
  - url: https://www.dealer.com/company-news/data-integration-unlocks-website-personalization-press-release/
    type: Documentation
  - url: https://www.dealer.com/products/integrated-partner-program
    type: Documentation
  description: >-
    Website Experience Optimization capability that personalizes inventory,
    content, specials, and assets on dealer sites using cross-platform shopper
    behavior from Autotrader and Kelley Blue Book. Delivered as a managed
    Dealer.com product rather than a documented public API; no endpoints,
    schema, or authentication are published. Modeled here for catalog
    completeness.
