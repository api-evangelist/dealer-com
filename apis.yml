apis:
  - aid: dealer-com:dealer-com-accounts-api
    name: Dealer.com Accounts API
    tags:
      - Accounts
      - Dealership
      - Automotive
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.inv.dealer.com/content/accounts/accountsApi.html
    baseURL: https://api.dealer.com
    description: >-
      Dealership account information for dealers who have a relationship with Dealer.com.
      GET /accounts/search returns a filterable, paginated list; GET /accounts/id/{accountId}
      returns one account. Payloads carry name, address, contact, web address, time-zone
      offset, OEM franchises, external dealer codes keyed by system (driverside, route-one,
      at-kbb), and the dealer-group hierarchy through parentIds, ancestorIds and decendantIds.
      Filterable by accountId, ancestorId, parentId, franchise, country, state, dealerCode and
      dealerCodeType. Sparse fieldsets via a repeatable select parameter. Note: the sample
      response self-links to accounts.inv.dealer.com, which no longer resolves.
    properties:
      - url: https://developer.inv.dealer.com/content/accounts/accountsApi.html
        type: APIReference
      - url: https://developer.inv.dealer.com/content/accounts/accounts-home.html
        type: Documentation
      - url: https://developer.inv.dealer.com/accounts/accounts
        type: Console
  - aid: dealer-com:dealer-com-incentives-api
    name: Dealer.com Incentives API
    tags:
      - Incentives
      - Offers
      - Automotive
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.inv.dealer.com/content/incentives/incentivesApi.html
    baseURL: https://api.dealer.com
    description: >-
      Manufacturer and dealer incentive offers. GET /incentives returns a filterable,
      paginated list; GET /incentives/id/{uniqueId} returns one offer, keyed by a composite
      accountID_incentiveID. Each incentive carries its type (Cash, Lease, Finance), the
      creating account or third-party feed, effective and expiration dates, title and short
      title, three classes of disclaimer (general, state, type), offer details, an image URL,
      priority and featured flags, language codes, and trim-level applicability through
      vehicleTrims and globalVehicleTrimIds or through applicable make, model and year.
    properties:
      - url: https://developer.inv.dealer.com/content/incentives/incentivesApi.html
        type: APIReference
      - url: https://developer.inv.dealer.com/content/accounts/accounts-home.html
        type: Documentation
      - url: https://developer.inv.dealer.com/incentives/incentives
        type: Console
  - aid: dealer-com:dealer-com-vehicle-api
    name: Dealer.com Vehicle API
    tags:
      - Inventory
      - Vehicle Data
      - Automotive
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.inv.dealer.com/content/inventory/vehicleApi.html
    baseURL: https://api.dealer.com
    description: >-
      Vehicle inventory available for sale at Dealer.com dealerships in the United States and
      Canada. GET /vehicles/search returns a filterable, paginated list; GET /vehicles/id/{uuid}
      returns one vehicle, where the uuid uniquely represents a VIN and account combination.
      Sixty-six selectable properties span identity (vin, stockNumber, chromeId, autodata ids),
      classification (make, model, year, trim, category, certified, status), specification
      (body style, drivetrain, engine, transmission, fuel economy, odometer, option codes),
      appearance, and up to twenty distinct price fields including msrp, invoicePrice,
      internetPrice, emailPrice, kbbValue and several named for specific dealer groups and CRM
      vendors. Filterable by vin, uuid, accountId, associatedAccountId, stockNumber, status,
      category, make, chromeId, certified and removed.
    properties:
      - url: https://developer.inv.dealer.com/content/inventory/vehicleApi.html
        type: APIReference
      - url: https://developer.inv.dealer.com/content/inventory/inventory-home.html
        type: Documentation
      - url: https://developer.inv.dealer.com/inventory/vehicles
        type: Console
  - aid: dealer-com:dealer-com-equipment-api
    name: Dealer.com Equipment API
    tags:
      - Inventory
      - Vehicle Data
      - Automotive
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.inv.dealer.com/content/inventory/equipment.html
    baseURL: https://api.dealer.com
    description: >-
      Equipment and option data for vehicles in Dealer.com inventory, exposed as its own
      resource alongside the Vehicle API. GET /vehicles/equipment returns a paginated list and
      GET /vehicles/equipment/id/{uuid} returns equipment for a single vehicle, addressed by
      the same vehicle uuid used by the Vehicle API. Part of the Inventory family documented in
      the Dealer Developer Portal under a shared set of General Concepts covering base URL,
      versioning, API key authentication, quotas and error handling.
    properties:
      - url: https://developer.inv.dealer.com/content/inventory/inventory-home.html
        type: Documentation
      - url: https://developer.inv.dealer.com/inventory/equipment
        type: Console
  - aid: dealer-com:dealer-com-price-api
    name: Dealer.com Price API
    tags:
      - Inventory
      - Pricing
      - Automotive
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.inv.dealer.com/content/inventory/price.html
    baseURL: https://api.dealer.com
    description: >-
      Vehicle price data for Dealer.com inventory, exposed as its own resource within the
      Inventory family alongside the Vehicle and Equipment APIs. Complements the twenty price
      fields already selectable on the Vehicle resource. Read-only, API key authenticated,
      paginated with start and size, and constrained to the dealer accounts the consumer has
      been authorized to access.
    properties:
      - url: https://developer.inv.dealer.com/content/inventory/inventory-home.html
        type: Documentation
      - url: https://developer.inv.dealer.com/inventory/price
        type: Console
  - aid: dealer-com:dealer-com-website-integration-api
    name: Dealer.com Website Integration API
    tags:
      - Website Platform
      - Partner Program
      - Embedded Components
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://dealerdotcom.github.io/web-integration-api-docs/
    baseURL: https://api.web.dealer.com
    description: >-
      Browser-side JavaScript API that lets Integrated Partner Program partners place and
      control experiences on Dealer.com dealer websites. A partner hosts one script on their
      own CDN; Dealer.com loads it into the page, where it obtains a handle from
      window.DDC.APILoader and subscribes to versioned events (page-load-v1,
      dealership-info-v1, vehicle-shown-v1, vehicle-data-updated-v1) or queries context
      directly through promise-returning utilities. Content is placed into named insert
      locations (vehicle-media, vehicle-badge, vehicle-pricing, vehicle-payments,
      primary-banner, secondary-content, content) or as managed call-to-action buttons.
      Content-delivery authentication is JWT-based: Dealer.com signs a claim that it rendered
      a given page for a given account on a given domain with given vehicles, and the partner
      validates it against the published rotating JWK Set at api.web.dealer.com.
    properties:
      - url: https://dealerdotcom.github.io/web-integration-api-docs/
        type: APIReference
      - url: https://github.com/DealerDotCom/web-integration-api-docs
        type: SourceCode
      - url: https://api.web.dealer.com/ipp/keys/jwks.json
        type: JWKS
      - url: components/dealer-com-components.yml
        type: Components
      - url: changelog/dealer-com-changelog.yml
        type: ChangeLog
  - aid: dealer-com:dealer-com-leads-api
    name: Dealer.com Leads API
    tags:
      - Leads
      - CRM
      - Digital Retail
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.coxautoinc.com/
    endpointsModeled: true
    properties:
      - url: https://developer.coxautoinc.com/
        type: Documentation
      - url: https://www.dealer.com/products/integrated-partner-program
        type: Documentation
    description: >-
      Lead generation and management capability - pre-qualification, messaging,
      and customer-engagement tools that capture website leads and route them into
      dealer CRM and Cox Automotive systems (Dealertrack, VinSolutions). The Cox
      Automotive Integration Platform documents Lead Management operations to view,
      create, and update leads, including trade-ins and vehicles of interest, but
      behind OAuth and an approved partner agreement. Endpoints modeled, not an
      open public surface.
