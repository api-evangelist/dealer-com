- aid: dealer-com:dealer-com-website-integration-api
  name: Dealer.com Website Integration API
  tags:
  - Website
  - Integration
  - Partners
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.dealer.com/products/integrated-partner-program
  endpointsModeled: true
  properties:
  - url: https://www.dealer.com/resources/new-website-integration-api-delivers-cutting-edge-third-party-experience-on-dealer-com-platform/
    type: Documentation
  - url: https://www.dealer.com/products/integrated-partner-program
    type: Documentation
  description: >-
    Partner-gated interface that lets approved third parties place and control
    their own experiences on the Dealer.com website platform without custom
    per-dealer integrations, while Dealer.com monitors performance and protects
    dealer data. Access is arranged through the Integrated Partner Program;
    onboarding contact is Website.Integration.API@coxautoinc.com. No public
    endpoints, base URL, or authentication scheme are documented - the capability
    is modeled here, not sourced from an open specification.
- aid: dealer-com:dealer-com-inventory-imagery-api
  name: Dealer.com Inventory and Imagery API
  tags:
  - Inventory
  - Imagery
  - Feeds
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.dealer.com/integrations/
  endpointsModeled: true
  properties:
  - url: https://www.dealer.com/integrations/
    type: Documentation
  - url: https://www.dealer.com/products/integrated-partner-program
    type: Documentation
  description: >-
    Logical grouping for the vehicle inventory and imagery integrations exposed
    to certified partners - photography, 360-degree spins, video, and image
    optimization tools that read and enrich dealer inventory shown on Dealer.com
    sites. Inventory feed and market pricing data is also reachable via the wider
    Cox Automotive Integration Platform. Partner-gated; endpoints are modeled,
    not documented publicly.
- aid: dealer-com:dealer-com-leads-api
  name: Dealer.com Leads API
  tags:
  - Leads
  - CRM
  - Digital Retail
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.coxautoinc.com/
  endpointsModeled: true
  properties:
  - url: https://developer.coxautoinc.com/
    type: Documentation
  - url: https://www.dealer.com/products/integrated-partner-program
    type: Documentation
  description: >-
    Lead generation and management capability - pre-qualification, messaging,
    and customer-engagement tools that capture website leads and route them into
    dealer CRM and Cox Automotive systems (Dealertrack, VinSolutions). The Cox
    Automotive Integration Platform documents Lead Management operations to view,
    create, and update leads, including trade-ins and vehicles of interest, but
    behind OAuth and an approved partner agreement. Endpoints modeled, not an
    open public surface.
- aid: dealer-com:dealer-com-website-personalization-api
  name: Dealer.com Website Personalization API
  tags:
