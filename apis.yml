aid: dealer-com
url: https://raw.githubusercontent.com/api-evangelist/dealer-com/refs/heads/main/apis.yml
name: Dealer.com
kind: company
description: >-
  Dealer.com, a Cox Automotive brand, builds automotive dealership websites,
  digital advertising, and digital marketing technology used by thousands of
  franchise and independent dealers across North America. Its integration
  surface is partner-gated: third parties embed experiences on dealer sites
  through the Dealer.com Website Integration API and the Integrated Partner
  Program, while inventory, leads, deal, and digital-retail data flow through
  the broader Cox Automotive Integration Platform (developer.coxautoinc.com),
  which uses OAuth (Okta) and requires an approved partner agreement. Dealer.com
  does not publish an open, self-serve public API; the endpoints modeled here
  are logical groupings of the partner capabilities, not a documented public
  surface.
