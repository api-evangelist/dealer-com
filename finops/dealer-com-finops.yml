description: >-
  FinOps view of Dealer.com spend. Dealer.com does not bill API access as a
  usage-metered developer product; there is no public per-call rate card. Cost
  is incurred through commercial agreements - the Dealer.com Integrated Partner
  Program and the Cox Automotive Integration Platform - and through Dealer.com's
  dealer-facing products (websites, digital advertising, digital marketing),
  which are sold on enterprise contracts. For a partner, the dominant cost is
  the negotiated partner/subscription agreement plus the partner's own
  engineering to build and maintain the integration, rather than variable
  per-request API charges.
notes: >-
  Per-unit API rates are not published and cannot be reconciled here. Treat
  Dealer.com/Cox Automotive spend as contracted subscription and partnership
  fees. Confirm actual commercial terms directly with Cox Automotive.
sources:
- https://www.dealer.com/products/integrated-partner-program
