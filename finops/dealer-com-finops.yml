publisherName: Dealer.com (Cox Automotive)
serviceCategory: Automotive Digital Marketing and Websites
billingModel:
  pricingCategory: Contract
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
meters:
- name: partner_agreement
  description: Contracted Integrated Partner Program or Cox Automotive Integration Platform agreement fee. Negotiated, not publicly rated.
  unit: contract
  aggregation: sum
  dimensions:
  - partner
  - program
- name: dealer_subscription
  description: Dealer-facing Dealer.com product subscriptions (website, advertising, marketing), sold on enterprise contract.
  unit: subscription
  aggregation: sum
  dimensions:
  - dealer
  - product
- name: integration_engineering
  description: Partner's own build-and-maintain cost for the integration (no Dealer.com invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - partner
principles:
- name: Visibility
  description: Track contracted partner and dealer subscription fees; there is no per-call meter to monitor since API access is not usage-billed.
- name: Allocation
  description: Attribute partner-program and platform fees to the products and dealer accounts that use the integration.
- name: Optimization
  description: Consolidate integrations under a single partner agreement where possible; scope inventory and lead feeds to needed data to reduce engineering and maintenance overhead.
- name: Accountability
  description: Assign an owner for the Cox Automotive/Dealer.com relationship who reviews contract terms and renewal against realized integration value.
