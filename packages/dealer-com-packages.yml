provider: Dealer.com
providerId: dealer-com
description: >-
  Dealer.com publishes no first-party client SDK in any package registry. The Developer Portal
  home page tells developers to "Use the Code Library to download our SDK's on GitHub", but the
  Code Library link is dead (client-side route with no content behind it) and the DealerDotCom
  GitHub organization contains no client library — its 60 public repositories are forks of
  third-party OSS (zipkin, grails, terraform, libsass, envoy) plus two documentation
  repositories. The only first-party client artifact Dealer.com ships is the browser-side
  Website Integration API loader, which is a platform global injected into dealer websites, not
  an installable package.
