aid: dealer-com
name: Dealer.com
review:
  question: Does Dealer.com expose a documented public WebSocket API?
  answer: false
  date: '2026-07-10'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Dealer.com publishes no documented public
    API of any transport - REST, SSE, or WebSocket. Its integration surface is
    partner-gated behind the Dealer.com Integrated Partner Program and the wider
    Cox Automotive Integration Platform (OAuth/Okta), and the platform-level
    APIs that are documented there (leads, inventory, deal, digital retail) are
    request/response REST over HTTPS. There is no server-push WebSocket or SSE
    endpoint on Dealer.com's own surface to model.
corrections:
  - date: '2026-08-12'
    by: API Evangelist enrichment pipeline
    correction: |
      The 2026-07-10 finding below overstated the gate. The WebSocket answer stands
      (no ws:// or wss:// surface is documented anywhere), but the claim that
      Dealer.com "does not publish an open, self-serve public API at all" is WRONG
      and was the result of never reaching Dealer.com's own developer portal.

      Dealer.com operates a public Dealer Developer Portal at
      https://developer.inv.dealer.com/ documenting three REST API families on its
      own domain — Accounts, Incentives and Inventory (Vehicle, Equipment, Price),
      collectively the "Vehicle Consumer Display API". The reference is fully public
      and requires no login. It publishes a base URL (https://api.dealer.com), a
      version (1.0), API-key authentication via an api_key query parameter, numeric
      quotas (2 calls/second, 5,000 calls/day, raised case-by-case), offset
      pagination (start/size), sparse fieldsets (repeatable select), HAL-style
      links[], full parameter tables, response samples and object models, and an
      HTTP error table. Keys are self-registered at
      https://coxautoinc.mashery.com/member/register.

      The Website Integration API is likewise fully documented in public git at
      https://github.com/DealerDotCom/web-integration-api-docs (rendered at
      https://dealerdotcom.github.io/web-integration-api-docs/), with a dated
      changelog and a live JWK Set at https://api.web.dealer.com/ipp/keys/jwks.json.

      What IS true: no machine-readable specification is retrievable. All five
      Swagger documents the portal's own API Explorer loads
      (/swagger-docs/*/vcda_*.json) return HTTP 200 with the 42-byte body
      {"message":"Missing Authentication Token"} and carry an S3 Last-Modified of
      2020-02-13. The documented base host api.dealer.com returns NXDOMAIN, as does
      accounts.inv.dealer.com, while vehicles/incentives/equipment/price
      .inv.dealer.com are live AWS API Gateway endpoints answering 403 without a key.
      See lifecycle/dealer-com-lifecycle.yml for the evidenced decay findings.
findings:
  summary: |
    SUPERSEDED IN PART — see corrections above (2026-08-12). The WebSocket answer
    stands; the "no public API" characterization does not.

    Dealer.com does not publish a documented public WebSocket API - and, more
    broadly, does not publish an open, self-serve public API at all. Dealer.com
    is a Cox Automotive brand providing dealership websites, digital advertising,
    and digital marketing. Third-party access is partner-gated:

      - The Dealer.com Website Integration API lets approved partners place and
        control experiences on dealer websites; it is arranged through the
        Integrated Partner Program (onboarding via
        Website.Integration.API@coxautoinc.com). No endpoints, base URL, or auth
        scheme are published.
      - The Integrated Partner Program spans inventory and imagery, website and
        content, lead generation and management, digital retailing, and digital
        advertising, joined via an intake form and partner certification - not
        open API documentation.
      - Platform-level data (leads, inventory, deal, digital retail) is reachable
        through the Cox Automotive Integration Platform at
        developer.coxautoinc.com, which uses OAuth (Okta) and requires an
        approved partner agreement. Those documented operations are REST over
        HTTPS.

    No realtime, bidirectional, or streaming WebSocket (ws:// or wss://) endpoint
    is documented on any Dealer.com or Cox Automotive Integration Platform
    surface as of the review date.
  accessModel: |
    Partner-gated / contact-sales. There is no public developer signup for a
    Dealer.com API. Partners apply through the Integrated Partner Program or the
    Cox Automotive Integration Platform, are vetted and certified, and receive
    OAuth credentials under a commercial agreement. Pricing is enterprise /
    negotiated and is not published.
  transports:
    - protocol: REST
      scheme: https
      documented: partial
      note: >-
        The Cox Automotive Integration Platform documents REST APIs (leads,
        inventory, deal, digital retail) behind OAuth/Okta for approved partners.
        Dealer.com's own Website Integration API is announced but not publicly
        specified.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: >-
        No WebSocket endpoint is documented on Dealer.com or the Cox Automotive
        Integration Platform as of the review date.
    - protocol: SSE
      scheme: https
      documented: false
      note: No Server-Sent Events streaming surface is documented.
  endpointsConfirmedRest: []
  endpointsModeledNote: |
    The API entries in apis.yml (Website Integration, Inventory and Imagery,
    Leads, Website Personalization, Digital Advertising) are logical models of
    partner capabilities. They carry endpointsModeled: true and deliberately do
    NOT assert base URLs or concrete endpoints, because Dealer.com does not
    publish an open specification. Observed Cox platform infrastructure hosts
    (e.g. control.api.coxautoinc.com, developer-sfservices-api.prod.coxautoapi.com)
    appear only in the developer-portal shell and are not documented public
    Dealer.com endpoints.
