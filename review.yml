actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and Dealer.com publishes no open public
    API. The partner capabilities are modeled in apis.yml with
    endpointsModeled: true and no fabricated endpoints. No AsyncAPI document was
    created because there is no documented server-push transport (WebSocket or
    SSE) on Dealer.com's own surface to model.
