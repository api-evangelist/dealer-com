specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Dealer.com
providerId: dealer-com
created: '2026-07-10'
modified: '2026-08-12'
generated: '2026-08-12'
method: searched
source: https://developer.inv.dealer.com/content/home.html
reconciled: false
tags:
- Automotive
- Dealership
- Digital Marketing
- Partner Program
- Plans
description: >-
  Dealer.com does not sell API access as a self-serve, metered product. Access
  to the Website Integration API and the other partner capabilities is arranged
  through the Dealer.com Integrated Partner Program and, at the platform level,
  the Cox Automotive Integration Platform. Terms are commercial and negotiated:
  partners are vetted and certified, sign a partner agreement, and receive OAuth
  credentials. Dealer.com's own products (websites, digital advertising, digital
  marketing) are sold to dealers on enterprise contracts. No public per-call or
  per-tier API pricing is published.
notes: >-
  Updated 2026-08-12. There is still no public rate card, but the picture is not
  purely contact-sales: the Dealer Developer Portal (developer.inv.dealer.com)
  offers self-registration for an API key with a PUBLISHED default quota of 2
  calls/second and 5,000 calls/day, raised case-by-case. What is not published is
  the price of that key, or whether it carries one at all — the registration flow
  at coxautoinc.mashery.com is the only place that would say. The Integrated
  Partner Program and the Cox Automotive Integration Platform remain enterprise /
  negotiated. plan_count 3. Verify current partner terms with Cox Automotive
  during any reconciliation.
sources:
- https://developer.inv.dealer.com/content/home.html
- https://developer.inv.dealer.com/content/inventory/inventory-home.html
- https://coxautoinc.mashery.com/member/register
- https://www.dealer.com/products/integrated-partner-program
- https://www.dealer.com/integrations/
- https://developer.coxautoinc.com/
plans:
- id: dealer-com-developer-portal-key
  name: Dealer Developer Portal API Key
  type: registration
  description: >-
    Self-registered API key for the Dealer.com Developer Portal read APIs (Accounts,
    Incentives, Inventory / Vehicle / Equipment / Price). Registration is at the Cox
    Automotive Developer Network. Dealer.com publishes the QUOTA attached to this tier
    but publishes no price for it, and access to data is further constrained: the
    dealer and vehicle datasets are limited to Dealer.com clients, and each consumer
    only sees the accounts they have been authorized for.
  entries:
  - label: Default request quota
    name: default_quota_per_second
    type: quota
    metric: requests
    limit: 2
    timeFrame: second
    geo: north-america
    unit: 1
    price: not published
    userMultiplied: false
  - label: Default daily quota
    name: default_quota_per_day
    type: quota
    metric: requests
    limit: 5000
    timeFrame: day
    geo: north-america
    unit: 1
    price: not published
    userMultiplied: false
  elements:
  - name: Accounts API
  - name: Incentives API
  - name: Inventory API (Vehicle, Equipment, Price)
  - name: API key authentication
  - name: Case-by-case rate limit increases
- id: dealer-com-integrated-partner
  name: Integrated Partner Program
  type: enterprise
  description: >-
    Certified partner access to place integrations on Dealer.com websites
    (inventory and imagery, website and content, leads, digital retailing,
    digital advertising) via the Website Integration API. Partners apply through
    an intake form, are vetted and certified, and operate under a commercial
    agreement. Onboarding contact for the Website Integration API is
    Website.Integration.API@coxautoinc.com.
  entries:
  - label: Partner Agreement
    name: partner_agreement
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: north-america
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: Website Integration API Access
  - name: Partner Certification
  - name: Dealer Directory Placement
- id: dealer-com-cox-integration-platform
  name: Cox Automotive Integration Platform
  type: enterprise
  description: >-
    Platform-level REST API access (leads, inventory, deal, digital retail)
    through developer.coxautoinc.com, secured with OAuth (Okta) and gated by an
    approved Cox Automotive partner agreement. Pricing is negotiated per
    integration and volume.
  entries:
  - label: Platform Partner Agreement
    name: platform_agreement
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: north-america
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: OAuth Credentials
  - name: Lead Management API
  - name: Inventory and Deal Data
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
