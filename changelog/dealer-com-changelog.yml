  Dealer.com maintains one public, dated changelog: CHANGELOG.md in the DealerDotCom/
  web-integration-api-docs repository, which documents the browser-side Website Integration
  API. It follows Keep a Changelog 1.0.0 and is written by a CI release workflow that also
  enforces a changelog entry on every pull request. It is a DOCUMENTATION changelog, not an
  API-surface changelog — most releases record doc-tooling changes, and only a subset record
  changes to the API itself. The Dealer Developer Portal APIs (Accounts, Incentives,
  Inventory) publish no changelog of any kind.
